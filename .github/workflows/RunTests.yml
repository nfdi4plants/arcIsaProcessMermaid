name: Build and test

on:
  push:
    branches: [ main, "test_ci" ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SETUP .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 8.x.x

      # Run Tests
      - name: Run Tests
        run: dotnet test --verbosity normal